<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tradutor de Pets</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0FF;--ink:#231F5C;--card:#fff;--accent:#FF5C8A;--sun:#FFC933;--muted:#6B67A3;--line:#D5D8FF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17143F;--ink:#F1EEFF;--card:#262266;--muted:#A9A5E0;--line:#3A3590}}
:root[data-theme="dark"]{--bg:#17143F;--ink:#F1EEFF;--card:#262266;--muted:#A9A5E0;--line:#3A3590}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:28px 20px 40px;text-align:center}
h1{font-size:2.3rem;line-height:1.05;margin:0 0 6px;font-weight:700}
.sub{color:var(--muted);margin:0 0 26px;font-size:1.05rem}
.stage{position:relative;height:200px;display:grid;place-items:center}
canvas{position:absolute;inset:0;width:100%;height:100%}
#rec{position:relative;z-index:1;width:132px;height:132px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-family:inherit;font-size:3.4rem;cursor:pointer;box-shadow:0 8px 0 #C93768;transition:transform .12s,box-shadow .12s}
#rec:active{transform:translateY(5px);box-shadow:0 3px 0 #C93768}
#rec:focus-visible{outline:4px solid var(--sun);outline-offset:4px}
#rec.on{background:var(--sun);color:var(--ink);box-shadow:0 8px 0 #C99400;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){#rec.on{animation:none}}
.hint{min-height:1.5em;color:var(--muted);margin:14px 0 18px}
.bubble{background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:22px 20px;text-align:left;position:relative;display:none}
.bubble.show{display:block}
.bubble:before{content:"";position:absolute;top:-17px;left:50%;margin-left:-14px;border:14px solid transparent;border-bottom-color:var(--ink);border-top:0}
.mood{display:inline-block;background:var(--sun);color:#231F5C;border-radius:99px;padding:3px 14px;font-weight:500;font-size:.9rem;margin-bottom:10px}
.txt{font-size:1.45rem;line-height:1.3;margin:0 0 14px;font-weight:500}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:9px;flex:1;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .8s}
.btns{display:flex;gap:10px;margin-top:14px}
.btns button{flex:1;font-family:inherit;font-size:1rem;padding:10px;border-radius:14px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;font-weight:500}
.btns button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dots span{display:inline-block;width:12px;height:12px;margin:0 3px;border-radius:50%;background:var(--accent);animation:b .8s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-8px)}}
h2{font-size:1.1rem;margin:30px 0 8px;text-align:left}
ul{list-style:none;margin:0;padding:0;text-align:left}
li{padding:10px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:.98rem}
.fine{margin-top:26px;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Tradutor de Pets</h1>
  <p class="sub">Grave o latido e descubra o que ele realmente quis dizer.</p>
  <div class="stage">
    <canvas id="cv"></canvas>
    <button id="rec" aria-pressed="false" aria-label="Gravar latido">🐾</button>
  </div>
  <p class="hint" id="hint" aria-live="polite">Toque na pata e deixe o seu cachorro falar.</p>
  <div class="bubble" id="bubble" aria-live="polite">
    <div id="loading" class="dots" hidden><span></span><span></span><span></span></div>
    <div id="result">
      <div class="mood" id="mood"></div>
      <p class="txt" id="txt"></p>
      <div class="meta"><span>Precisão</span><div class="bar"><i id="fill"></i></div><span id="pct"></span></div>
      <div class="btns"><button id="say">Ouvir em voz alta</button><button id="again">Traduzir de novo</button></div>
    </div>
  </div>
  <div id="histBox" hidden><h2>Últimas traduções</h2><ul id="hist"></ul></div>
  <p class="fine">Entretenimento puro: as traduções são 100% inventadas. O áudio não sai do seu aparelho.</p>
</main>
<script>
const FRASES=[
"Eu vi uma folha. Precisamos conversar sobre isso.",
"O chão está mais frio que ontem. Exijo uma explicação.",
"Eu não latiria se o carteiro não existisse. Pense nisso.",
"Sua tigela está só 90% cheia? Isso é um crime.",
"Declaro oficialmente: aquela almofada me ofendeu.",
"Alô, contador? Preciso declarar 14 petiscos que não recebi.",
"Há um pensamento no meu rabo e eu vou persegui-lo.",
"Meu advogado me aconselhou a não comentar sobre o sofá.",
"Passei só para avisar que amo você e que o aspirador é um monstro.",
"Vi meu reflexo na porta. Ele começou.",
"Qual é a senha do wi-fi? Preciso pesquisar sobre ossos.",
"Reunião de emergência: quem soltou esse cheiro?",
"Se você consegue ler isto, está sentado no meu lugar.",
"Eu pensava na fundação do Império Romano. E em salsicha.",
"Cuidado: tem uma moto a 3 quilômetros daqui. Eu sinto.",
"Estou latindo por esporte. Pode continuar o seu dia.",
"Atenção, humanos: a lua está me encarando de novo.",
"Mudei de nome hoje. Agora sou o Sr. Bigodes III. Respeite.",
"Quero fazer uma reclamação formal sobre a gravidade.",
"Para onde a bola foi? Só olhei por dois segundos.",
"Tem uma formiga na parede. Ninguém mais se importa?",
"Você saiu por cinco minutos. Para mim foram cinco anos.",
"Meu horóscopo disse: hoje é dia de cavar. Não discuto com o universo.",
"Eu sou um bom menino? Responda em até três segundos."];
const HUMORES=["Indignado","Filosófico","Suspeito","Apaixonado","Em crise existencial","Heroico","Faminto de drama","Conspiratório","Dramático"];
const $=id=>document.getElementById(id);
const rec=$("rec"),cv=$("cv"),ctx=cv.getContext("2d");
let stream=null,actx=null,an=null,raf=0,on=false,fake=false,timer=0,last="",hist=[];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function size(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d}
addEventListener("resize",size);size();
function draw(){
  const w=cv.width,h=cv.height,n=36,gap=w/n;
  ctx.clearRect(0,0,w,h);
  let data=null;
  if(an){data=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(data)}
  const col=getComputedStyle(document.documentElement).getPropertyValue("--accent");
  ctx.fillStyle=col;
  for(let i=0;i<n;i++){
    const v=data?data[Math.floor(i*data.length/n/2)]/255:Math.random()*.9;
    const bh=Math.max(6,v*h*.9),x=i*gap+gap*.2;
    ctx.beginPath();ctx.roundRect?ctx.roundRect(x,(h-bh)/2,gap*.6,bh,gap*.3):ctx.rect(x,(h-bh)/2,gap*.6,bh);ctx.fill();
  }
  raf=requestAnimationFrame(draw);
}
async function start(){
  fake=false;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    actx=new (window.AudioContext||window.webkitAudioContext)();
    an=actx.createAnalyser();an.fftSize=256;
    actx.createMediaStreamSource(stream).connect(an);
  }catch(e){
    fake=true;an=null;
    $("hint").textContent="Sem acesso ao microfone. Vou fingir que ouvi o latido.";
  }
  on=true;rec.classList.add("on");rec.setAttribute("aria-pressed","true");rec.textContent="⏹";
  rec.setAttribute("aria-label","Parar gravação");
  if(!fake)$("hint").textContent="Ouvindo... toque de novo para traduzir.";
  $("bubble").classList.remove("show");
  draw();
  timer=setTimeout(()=>{if(on)stop()},8000);
}
function stop(){
  on=false;clearTimeout(timer);cancelAnimationFrame(raf);
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(actx)actx.close().catch(()=>{});
  stream=null;actx=null;an=null;
  ctx.clearRect(0,0,cv.width,cv.height);
  rec.classList.remove("on");rec.setAttribute("aria-pressed","false");rec.textContent="🐾";
  rec.setAttribute("aria-label","Gravar latido");
  translate();
}
function translate(){
  $("hint").textContent="Consultando o dicionário canino...";
  $("bubble").classList.add("show");$("loading").hidden=false;$("result").hidden=true;
  setTimeout(()=>{
    let f;do{f=pick(FRASES)}while(f===last&&FRASES.length>1);last=f;
    const m=pick(HUMORES),p=Math.floor(60+Math.random()*40);
    $("mood").textContent=m;$("txt").textContent="“"+f+"”";$("pct").textContent=p+"%";
    $("fill").style.width="0";
    $("loading").hidden=true;$("result").hidden=false;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{$("fill").style.width=p+"%"}));
    $("hint").textContent="Tradução concluída.";
    hist.unshift(f);hist=hist.slice(0,5);
    $("hist").innerHTML="";hist.forEach(h=>{const li=document.createElement("li");li.textContent="“"+h+"”";$("hist").appendChild(li)});
    $("histBox").hidden=false;
  },1500);
}
rec.addEventListener("click",()=>on?stop():start());
$("again").addEventListener("click",()=>{$("hint").textContent="Tentando outra interpretação...";translate()});
$("say").addEventListener("click",()=>{
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(last);u.lang="pt-BR";u.pitch=1.6;u.rate=1.05;speechSynthesis.speak(u)}catch(e){}
});
</script>
</body>
</html>
